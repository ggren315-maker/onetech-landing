<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар — OneTech</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="product">

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><img src="img/logo.png" alt="OneTech"></a>
      <nav class="nav">
        <a href="index.html#catalog">Каталог</a>
        <a href="index.html#gallery">Галерея</a>
        <a href="index.html#order">Замовити</a>
      </nav>
      <a href="tel:0800300144" class="header-phone">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
        <span>0 800 300 144</span>
      </a>
    </div>
  </header>

  <section class="product-page">
    <div class="container" id="productContent"></div>
  </section>

  <section id="order" class="order-section">
    <div class="container order-grid">
      <div class="order-info">
        <div class="section-label" style="color:#7dd3fc">Замовлення</div>
        <h2>Замовити цю модель</h2>
        <p>Залиште ім'я та телефон — передзвонимо та уточнимо доставку.</p>
      </div>
      <form class="order-form" id="orderForm">
        <p class="form-lead">Достатньо імені та телефону — решту узгодимо під час дзвінка.</p>
        <div class="form-row"><label for="name">Як до вас звертатися? *</label><input type="text" id="name" required placeholder="Олександр" autocomplete="name"></div>
        <div class="form-row"><label for="phone">Ваш телефон *</label><input type="tel" id="phone" required placeholder="+380 67 123 45 67" autocomplete="tel"></div>
        <div class="order-model-hint show" id="modelHint">
          <span>Цікавить: <strong id="modelHintText"></strong></span>
        </div>
        <input type="hidden" id="model" value="">
        <div class="form-row form-row-optional"><label for="message">Місто або коментар <span class="label-muted">(необов'язково)</span></label><textarea id="message" placeholder="Коли зручно передзвонити?"></textarea></div>
        <button type="submit" class="btn btn-primary btn-block" data-submit-label="Передзвоніть мені">Передзвоніть мені</button>
        <p class="form-note">Передзвонимо протягом 15 хвилин</p>
        <div class="form-success" id="formOk">✅ Дякуємо! Ми передзвонимо найближчим часом.</div>
        <div class="form-error" id="formErr"></div>
      </form>
    </div>
  </section>

  <script src="js/products-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
